document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection><\u002Fsc-if>\n\n      <sc-if value=\"{{drawOn}}\" hint-placeholder-val=\"{{false}}\"><section id=\"draw\" class=\"cs-wrap\" style=\"max-width:1280px;margin:0 auto;padding:40px 32px 120px;box-sizing:border-box\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;border-top:1px solid #12181c;padding-top:22px;margin-bottom:44px\">\n          <h2 data-grip=\"1\" style=\"margin:0;font-size:34px;font-weight:500;letter-spacing:-0.03em;color:#eef1f3\">daily draw<\u002Fh2>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5f6b72\">{{numDraw}}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:stretch\">\n          <div data-grip=\"1\" style=\"flex:1 1 560px;display:flex;flex-direction:column;gap:18px;padding:28px 26px;border:1px solid #141b20;border-radius:14px;background:linear-gradient(180deg,#0c1114,#090c0f);box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);box-sizing:border-box;min-width:0\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:'JetBrains Mono',monospace;font-size:13px\"><span style=\"color:#00c805\">today's winner<\u002Fspan><span style=\"color:#5f6b72\">{{dDayLabel}}<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{drawFirst}}\" hint-placeholder-val=\"{{false}}\"><h3 style=\"margin:0;font-size:28px;font-weight:500;letter-spacing:-0.02em;color:#eef1f3\">first draw in <span style=\"font-family:'JetBrains Mono',monospace;color:#00c805\">{{dCountdown}}<\u002Fspan><\u002Fh3>\n              <p style=\"margin:0;font-size:15px;line-height:1.6;color:#8a959c\">The first winner is drawn from today's hourly snapshots at {{dNextUtc}}.<\u002Fp><\u002Fsc-if>\n            <sc-if value=\"{{drawNone}}\" hint-placeholder-val=\"{{false}}\"><h3 style=\"margin:0;font-size:28px;font-weight:500;letter-spacing:-0.02em;color:#eef1f3\">no eligible holders<\u002Fh3>\n              <p style=\"margin:0;font-size:15px;line-height:1.6;color:#8a959c\">No wallet held enough on average that day. The prize carries over to the next draw.<\u002Fp><\u002Fsc-if>\n            <sc-if value=\"{{drawWon}}\" hint-placeholder-val=\"{{false}}\"><a href=\"{{dWinnerUrl}}\" title=\"{{dWinnerFull}}\" target=\"_blank\" rel=\"noopener\" data-draw-winner=\"1\" style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(28px,4vw,40px);letter-spacing:-0.02em;color:#eef1f3\" style-hover=\"color:#9fd9ff\">{{dWinner}} ↗<\u002Fa>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px;border-top:1px solid #141b20;padding-top:18px\">\n                <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#5f6b72\">chance<\u002Fspan><span data-draw-chance=\"1\" style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#eef1f3\">{{dChance}}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#5f6b72\">prize<\u002Fspan><sc-if value=\"{{dPaid}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#00c805\">{{dPrize}}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{dPending}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#8a959c\">payout pending<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#5f6b72\">payout<\u002Fspan><sc-if value=\"{{dPaid}}\" hint-placeholder-val=\"{{false}}\"><a href=\"{{dTxUrl}}\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;color:#9fd9ff;font-size:15px\" style-hover=\"color:#ffffff\">{{dTxShort}} ↗<\u002Fa><\u002Fsc-if><sc-if value=\"{{dPending}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#5f6b72\">—<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n              <\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <div data-grip=\"1\" style=\"flex:1 1 320px;display:flex;flex-direction:column;gap:18px;padding:28px 26px;border:1px solid #141b20;border-radius:14px;background:linear-gradient(180deg,#0c1114,#090c0f);box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);box-sizing:border-box;min-width:0\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#00c805\">next draw<\u002Fspan>\n            <span data-draw-timer=\"1\" style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(34px,4vw,44px);letter-spacing:-0.02em;color:#eef1f3\">{{dCountdown}}<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5f6b72\">{{dNextUtc}}<\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid #141b20;padding-top:18px;margin-top:auto\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#5f6b72\">participants today<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#eef1f3\">{{dParticipants}}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#5f6b72\">snapshots today<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#eef1f3\">{{dSnaps}}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:stretch;margin-top:24px\">\n          <div data-grip=\"1\" style=\"flex:1 1 560px;display:flex;flex-direction:column;gap:18px;padding:28px 26px;border:1px solid #141b20;border-radius:14px;background:linear-gradient(180deg,#0c1114,#090c0f);box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);box-sizing:border-box;min-width:0\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#00c805\">how it's picked<\u002Fspan>\n            <div style=\"display:flex;gap:14px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#00c805;flex-shrink:0\">01<\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:#aab4ba;text-wrap:pretty\">Hold the token. Your chance is your average balance over the day: 1 token = 1 ticket.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#00c805;flex-shrink:0\">02<\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:#aab4ba;text-wrap:pretty\">Wallets holding under {{dMinUsd}} on average are not eligible. Pools and programs never are.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#00c805;flex-shrink:0\">03<\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:#aab4ba;text-wrap:pretty\">The winner is picked from a Solana block hash that nobody knows in advance.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:14px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#00c805;flex-shrink:0\">04<\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:#aab4ba;text-wrap:pretty\">Prizes are sent manually from a public wallet. Every payout links to its transaction.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div data-grip=\"1\" style=\"flex:1 1 320px;display:flex;flex-direction:column;gap:18px;padding:28px 26px;border:1px solid #141b20;border-radius:14px;background:linear-gradient(180deg,#0c1114,#090c0f);box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);box-sizing:border-box;min-width:0\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#00c805\">verify<\u002Fspan>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#8a959c\">Recompute the latest draw in your browser from the raw data: the list hash, the random number and the winner.<\u002Fp>\n            <sc-if value=\"{{dCanVerify}}\" hint-placeholder-val=\"{{false}}\"><div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px\">\n              <button sc-camel-on-click=\"{{onVerify}}\" data-draw-verify=\"1\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#04140a;background:#00c805;border:0;padding:10px 18px;border-radius:8px;cursor:pointer\" style-hover=\"background:#19dd1f\">Verify<\u002Fbutton>\n              <a href=\"{{dRawP}}\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;color:#9fd9ff;font-size:12px\" style-hover=\"color:#ffffff\">participants.json ↗<\u002Fa>\n              <a href=\"{{dRawV}}\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;color:#9fd9ff;font-size:12px\" style-hover=\"color:#ffffff\">verify.json ↗<\u002Fa>\n            <\u002Fdiv><\u002Fsc-if>\n            <sc-if value=\"{{drawFirst}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5f6b72\">available after the first draw<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{dVerifyShow}}\" hint-placeholder-val=\"{{false}}\"><div style=\"display:flex;flex-direction:column;gap:6px\">\n              <span data-draw-verdict=\"1\" style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:{{dVerifyColor}}\">{{dVerifyText}}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.6;color:#5f6b72;overflow-wrap:anywhere\">{{dVerifyDetail}}<\u002Fspan>\n            <\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-grip=\"1\" style=\"margin-top:24px;border:1px solid #141b20;border-radius:14px;background:#090c0f;padding:8px 14px;box-sizing:border-box\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;font-family:'JetBrains Mono',monospace;font-size:13px\"><span style=\"color:#00c805\">history<\u002Fspan><span style=\"color:#5f6b72\">last 7 draws<\u002Fspan><\u002Fdiv>\n          <div class=\"cs-draw-head\" style=\"display:grid;grid-template-columns:110px minmax(0,1fr) 90px minmax(0,1fr) minmax(0,1fr);gap:16px;padding:10px 12px;border-bottom:1px solid #141b20;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#5f6b72\"><span>day<\u002Fspan><span>winner<\u002Fspan><span>chance<\u002Fspan><span>prize<\u002Fspan><span>payout tx<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{dHistEmpty}}\" hint-placeholder-val=\"{{false}}\"><div style=\"padding:16px 12px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#5f6b72\">no draws yet<\u002Fdiv><\u002Fsc-if>\n          <sc-for list=\"{{dHist}}\" as=\"h\" hint-placeholder-count=\"3\"><div class=\"cs-draw-row\" style=\"display:grid;grid-template-columns:110px minmax(0,1fr) 90px minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center;padding:12px;border-bottom:1px solid #12181c;font-family:'JetBrains Mono',monospace;font-size:13px\">\n            <span style=\"color:#8a959c\">{{h.day}}<\u002Fspan>\n            <span style=\"min-width:0\"><sc-if value=\"{{h.hasWinner}}\" hint-placeholder-val=\"{{true}}\"><a href=\"{{h.winnerUrl}}\" target=\"_blank\" rel=\"noopener\" style=\"color:#dfe5e8\" style-hover=\"color:#9fd9ff\">{{h.winner}} ↗<\u002Fa><\u002Fsc-if><sc-if value=\"{{h.noWinner}}\" hint-placeholder-val=\"{{false}}\"><span style=\"color:#5f6b72\">{{h.winner}}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n            <span style=\"color:#dfe5e8\">{{h.chance}}<\u002Fspan>\n            <span style=\"color:{{h.prizeColor}}\">{{h.prize}}<\u002Fspan>\n            <span style=\"min-width:0\"><sc-if value=\"{{h.hasTx}}\" hint-placeholder-val=\"{{false}}\"><a href=\"{{h.txUrl}}\" target=\"_blank\" rel=\"noopener\" style=\"color:#9fd9ff\" style-hover=\"color:#ffffff\">{{h.txShort}} ↗<\u002Fa><\u002Fsc-if><sc-if value=\"{{h.noTx}}\" hint-placeholder-val=\"{{true}}\"><span style=\"color:#5f6b72\">—<\u002Fspan><\u002Fsc-if><\u002Fspan>\n          <\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection><\u002Fsc-if>\n\n      <section id=\"how\" class=\"cs-wrap\" style=\"max-width:1280px;margin:0 auto;padding:40px 32px 120px;box-sizing:border-box\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;border-top:1px solid #12181c;padding-top:22px;margin-bottom:56px\">\n          <h2 data-grip=\"1\" style=\"margin:0;font-size:34px;font-weight:500;letter-spacing:-0.03em;color:#eef1f3\">how it works<\u002Fh2>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5f6b72\">{{numHow}}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px\">\n          <div data-grip=\"1\" style=\"display:flex;flex-direction:column;gap:18px;padding:28px 26px 26px;border:1px solid #141b20;border-radius:14px;background:linear-gradient(180deg,#0c1114,#090c0f);box-shadow:inset 0 1px 0 rgba(255,255,255,0.03)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px\"><span style=\"color:#00c805\">01<\u002Fspan><span style=\"color:#5f6b72\">CRAWL<\u002Fspan><\u002Fdiv>\n            <h3 style=\"margin:0;font-size:24px;font-weight:500;letter-spacing:-0.02em;color:#eef1f3\">Read the holders<\u002Fh3>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:#aab4ba;text-wrap:pretty\">Pulls the top holders straight from Robinhood Chain, no cached API in between. Pools, burn and router addresses are filtered out, so only real wallets are left on the board.<\u002Fp>\n            <div style=\"margin-top:auto;padding-top:14px;border-top:1px solid #141b20;display:flex;flex-wrap:wrap;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a959c\"><span>balances<\u002Fspan><span style=\"color:#3a454c\">·<\u002Fspan><span>share of float<\u002Fspan><span style=\"color:#3a454c\">·<\u002Fspan><span>entry block<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div data-grip=\"1\" style=\"display:flex;flex-direction:column;gap:18px;padding:28px 26px 26px;border:1px solid #141b20;border-radius:14px;background:linear-gradient(180deg,#0c1114,#090c0f);box-shadow:inset 0 1px 0 rgba(255,255,255,0.03)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px\"><span style=\"color:#00c805\">02<\u002Fspan><span style=\"color:#5f6b72\">TRACE<\u002Fspan><\u002Fdiv>\n            <h3 style=\"margin:0;font-size:24px;font-weight:500;letter-spacing:-0.02em;color:#eef1f3\">Walk each history<\u002Fh3>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:#aab4ba;text-wrap:pretty\">Each crawler walks back through a wallet's past before it bought in: how old it is, who funded it, how many transactions it ever made, and whether it hit the first blocks after launch.<\u002Fp>\n            <div style=\"margin-top:auto;padding-top:14px;border-top:1px solid #141b20;display:flex;flex-wrap:wrap;gap:6px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:3px;color:#ffb020;border:1px solid rgba(255,176,32,0.4)\">virgin<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:3px;color:#ffb020;border:1px solid rgba(255,176,32,0.4)\">short history<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:3px;color:#ffb020;border:1px solid rgba(255,176,32,0.4)\">transfer<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:3px;color:#ff4d4d;border:1px solid rgba(255,77,77,0.4)\">sniper<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div data-grip=\"1\" style=\"display:flex;flex-direction:column;gap:18px;padding:28px 26px 26px;border:1px solid #141b20;border-radius:14px;background:linear-gradient(180deg,#0c1114,#090c0f);box-shadow:inset 0 1px 0 rgba(255,255,255,0.03)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px\"><span style=\"color:#00c805\">03<\u002Fspan><span style=\"color:#5f6b72\">LINK<\u002Fspan><\u002Fdiv>\n            <h3 style=\"margin:0;font-size:24px;font-weight:500;letter-spacing:-0.02em;color:#eef1f3\">Tie wallets together<\u002Fh3>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:#aab4ba;text-wrap:pretty\">Connects wallets run by one person: tokens moved between them in one transaction, a shared funder, or a pack of fresh wallets that all bought in the same block.<\u002Fp>\n            <div style=\"margin-top:auto;padding-top:14px;border-top:1px solid #141b20;display:flex;flex-direction:column;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a959c\">\n              <span style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:28px;border-top:1.5px solid #ff4d4d\"><\u002Fspan>proven · direct on-chain tie<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:28px;border-top:1.5px dashed #ffb020\"><\u002Fspan>pack · moved together<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div data-grip=\"1\" style=\"display:flex;flex-direction:column;gap:18px;padding:28px 26px 26px;border:1px solid #141b20;border-radius:14px;background:linear-gradient(180deg,#0c1114,#090c0f);box-shadow:inset 0 1px 0 rgba(255,255,255,0.03)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:12px\"><span style=\"color:#00c805\">04<\u002Fspan><span style=\"color:#5f6b72\">VERDICT<\u002Fspan><\u002Fdiv>\n            <h3 style=\"margin:0;font-size:24px;font-weight:500;letter-spacing:-0.02em;color:#eef1f3\">Count the people<\u002Fh3>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:#aab4ba;text-wrap:pretty\">Linked wallets collapse into operators, so you see how many real people stand behind the top. Five signals roll into a 0–100 risk score with a one-line reason.<\u002Fp>\n            <div style=\"margin-top:auto;padding-top:14px;border-top:1px solid #141b20;display:flex;flex-wrap:wrap;gap:12px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.05em\"><span style=\"color:#00c805\">CLEAN<\u002Fspan><span style=\"color:#9fd9ff\">OK<\u002Fspan><span style=\"color:#ffb020\">RISKY<\u002Fspan><span style=\"color:#ff4d4d\">DANGER<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"roadmap\" class=\"cs-wrap\" style=\"max-width:1280px;margin:0 auto;padding:40px 32px 140px;box-sizing:border-box\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;border-top:1px solid #12181c;padding-top:22px;margin-bottom:56px\">\n          <h2 data-grip=\"1\" style=\"margin:0;font-size:34px;font-weight:500;letter-spacing:-0.03em;color:#eef1f3\">roadmap<\u002Fh2>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#5f6b72\">{{numRoadmap}}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:40px\">\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <span data-grip=\"1\" style=\"display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#00c805\"><span style=\"width:6px;height:6px;border-radius:50%;background:#00c805\"><\u002Fspan>SHIPPED<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;border-top:1px solid #141b20\">\n              <div data-grip=\"1\" style=\"padding:18px 0;border-bottom:1px solid #141b20;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:17px;font-weight:500;color:#eef1f3\">Live crawl<\u002Fspan><span style=\"font-size:14.5px;line-height:1.5;color:#8a959c;text-wrap:pretty\">Paste a CA, 6 crawlers scan the top holders. Buys through any trading bot read correctly.<\u002Fspan><\u002Fdiv>\n              <div data-grip=\"1\" style=\"padding:18px 0;border-bottom:1px solid #141b20;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:17px;font-weight:500;color:#eef1f3\">Bundle and virgin checks<\u002Fspan><span style=\"font-size:14.5px;line-height:1.5;color:#8a959c;text-wrap:pretty\">Wallets that received supply instead of buying it, or never traded a token before.<\u002Fspan><\u002Fdiv>\n              <div data-grip=\"1\" style=\"padding:18px 0;border-bottom:1px solid #141b20;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:17px;font-weight:500;color:#eef1f3\">Snipers and packs<\u002Fspan><span style=\"font-size:14.5px;line-height:1.5;color:#8a959c;text-wrap:pretty\" h';};\nconst fmtPrice=p=>typeof p!=='number'?null:'$'+(p>=1?p.toFixed(2):p.toPrecision(3));\nconst fmtTok=v=>v>=1e9?(v/1e9).toFixed(2)+'B':v>=1e6?(v/1e6).toFixed(0)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':String(Math.round(v));\nfunction normalizeResult(r){\n  if(!r) return r;\n  const ch=r.chain||chainOf(r.token)||'robinhood', dec=ch==='solana'?1e6:1e18;   // pump.fun — 6 знаков, Pons — 18\n  const h=r.header||{}, sup=(r.supply||0)/dec, circ=(r.circulating||0)/dec;\n  return {\n    header:{name:h.name,ticker:h.ticker,mcap:h.mcap_usd,liquidity:h.liquidity_usd,vol24h:h.vol24h_usd,\n            age:fmtAge(h.age_h),price:fmtPrice(h.price_usd),holders:r.holders_total,\n            supply:sup?Math.round(sup).toLocaleString('en-US'):null,\n            circulating:sup?`${fmtTok(circ)} (${(circ/sup*100).toFixed(1)}%)`:null,\n            pool:ch==='solana'?(r.launch&&r.launch.complete?'PumpSwap':'pump.fun curve'):'Pons V2',\n            deployer:shortAddr(r.launch&&r.launch.deployer)},\n    chain:ch, impact:r.metrics&&typeof r.metrics.impact==='number'?r.metrics.impact:null,\n    parts:r.parts||{},\n    operators:(r.operators||[]).filter(o=>o.wallets.length>1).map(o=>({wallets:o.wallets.map(shortAddr),share:o.share*100,level:o.level})),\n    raw:r\n  };\n}\n\n// ---- daily draw (/api/draw/*) ----\nconst SOL_ACC=a=>'https://solscan.io/account/'+a, SOL_TX=t=>'https://solscan.io/tx/'+t;\nconst drawShort=a=>a?a.slice(0,4)+'…'+a.slice(-4):'—';\nconst BIG_KEYS=['weight','total_weight','r','winner_weight','total'];   // веса — целые базовые единицы: BigInt, без потери точности\nconst parseBig=txt=>JSON.parse(txt,(k,v,ctx)=>BIG_KEYS.includes(k)&&typeof v==='number'?BigInt(ctx&&ctx.source!=null?ctx.source:v):v);\nasync function sha256hex(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}\nconst fmtChance=(w,t)=>{if(w==null||!Number(t)) return '—'; const p=Number(w)/Number(t)*100; return p>=10?p.toFixed(1)+'%':p>=0.01?p.toFixed(2)+'%':'<0.01%';};\nconst fmtLeft=ms=>{const s=Math.max(0,Math.floor(ms/1000)); return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');};\n// пересчёт розыгрыша в браузере, та же формула, что draw.py:\n// list_hash = sha256(канонический JSON [[адрес, вес], ...] по адресу, без пробелов);\n// r = int(sha256(blockhash + list_hash), 16) mod сумма_весов; победитель — первый адрес, у которого накопленная сумма > r\nasync function verifyDraw(day,base='/api/draw'){   // base: /api/draw (Solana) или /api/rewards (Robinhood)\n  const get=async u=>{const r=await fetch(u); if(!r.ok) throw new Error('http '+r.status); return parseBig(await r.text());};\n  const [p,v]=await Promise.all([get(`${base}/${day}/participants`),get(`${base}/${day}/verify`)]);\n  const rows=p.participants.map(x=>[String(x.address),BigInt(x.weight)]).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);\n  const canon='['+rows.map(([a,w])=>'['+JSON.stringify(a)+','+w.toString()+']').join(',')+']';\n  const lh=await sha256hex(canon), total=rows.reduce((s,[,w])=>s+w,0n);\n  let r=null, winner=null;\n  if(rows.length&&total>0n){\n    r=BigInt('0x'+await sha256hex((v.inputs.blockhash||'')+lh))%total;\n    let acc=0n; for(const [a,w] of rows){acc+=w; if(acc>r){winner=a; break;}}\n  }\n  const str=x=>x==null?null:x.toString(), bad=[];\n  if(lh!==v.inputs.list_hash||lh!==p.list_hash) bad.push('list_hash');\n  if(str(total)!==str(v.inputs.total_weight)) bad.push('total weight');\n  if(str(r)!==str(v.stored.r)) bad.push('r');\n  if(winner!==v.stored.winner) bad.push('winner');\n  return {ok:!bad.length,bad,lh,r,winner,n:rows.length};\n}\n\n// ---- token burn & holder rewards (/api/rewards/*) ----\nconst RH_ADDR=a=>'https://robinhoodchain.blockscout.com/address/'+a, RH_TX=t=>'https://robinhoodchain.blockscout.com/tx/'+t;\nconst rwShort=a=>a?a.slice(0,6)+'…'+a.slice(-4):'—';\nconst RW_BIG=['amount','total_supply','minted','dead_balance','weight','total_weight','payout_amount'];   // базовые единицы: BigInt\nconst parseRw=txt=>JSON.parse(txt,(k,v,ctx)=>RW_BIG.includes(k)&&typeof v==='number'?BigInt(ctx&&ctx.source!=null?ctx.source:v):v);\n// базовые единицы -> токены с разделителями; меньше 1000 — до двух знаков после точки\nconst fmtUnits=(raw,dec)=>{\n  if(raw==null) return '—';\n  const base=10n**BigInt(dec??18), b=BigInt(raw), i=b/base, f=(b%base)*100n/base;\n  const s=i.toLocaleString('en-US'); if(i>=1000n||f===0n) return s;\n  return s+'.'+f.toString().padStart(2,'0').replace(/0$/,'');\n};\nconst fmtPctOf=(a,b)=>{if(a==null||!b) return null; const p=Number(BigInt(a)*1000000n/BigInt(b))/10000; return p>=0.01?p.toFixed(2)+'%':p>0?'<0.01%':'0%';};\nconst fmtUtcTs=ms=>{const s=new Date(ms).toISOString(); return s.slice(0,10)+' '+s.slice(11,16)+' UTC';};\nconst RW_GRACE=1800000;   // сжигание за 30 минут до планового времени засчитывается этому времени\nconst rwTiles=ms=>fmtLeft(ms).split('').map(c=>({c,digit:c!==':',colon:c===':'}));   // таймер плитками: цифры в плитках, двоеточия без\nconst burnKey=st=>st.last_burn?st.last_burn.tx+':'+st.last_burn.log_index:null;\nconst burnedFor=(st,target)=>!!st.last_burn&&st.last_burn.time*1000>=target-RW_GRACE;\n\n// ---- price chart + probably rug (GET /api/chart after the verdict) ----\nconst RUG_LABEL={linked:'linked wallets',transfer:'received by transfer',virgin:'fresh wallets',bundle:'bundle / snipers'};\nconst MONO_F=\"'JetBrains Mono',monospace\";\nconst SUBD='₀₁₂₃₄₅₆₇₈₉';\nconst escH=s=>String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst fmtP=p=>{   // цена: $0.000131, мелкие — $0.0₅441\n  if(!(p>0)) return '$0';\n  if(p>=1) return '$'+p.toFixed(p>=100?0:2);\n  const z=Math.floor(-Math.log10(p));\n  if(z<4) return '$'+p.toFixed(z+3);\n  return '$0.0'+String(z).split('').map(c=>SUBD[c]).join('')+String(Math.round(p*Math.pow(10,z+3))).replace(/0+$/,'');\n};\nconst dropPct=r=>Math.round(r.drop*100);\nfunction rugReasons(rug){\n  if(!rug) return '';\n  const tot=rug.share||1;\n  const rows=(rug.parts||[]).map(p=>{const n=(p.wallets||[]).length;\n    return `<div class=\"cs-rug-row\" style=\"display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) auto;gap:8px 16px;align-items:center;font-family:${MONO_F};font-size:12.5px\">`\n      +`<span style=\"color:#c9d1d6\">${RUG_LABEL[p.kind]||escH(p.kind)}<\u002Fspan>`\n      +`<div style=\"height:4px;background:#141b20;border-radius:2px;overflow:hidden\"><div style=\"height:100%;width:${Math.max(2,p.share/tot*100).toFixed(1)}%;background:#ff4d4d\"><\u002Fdiv><\u002Fdiv>`\n      +`<span style=\"color:#8a959c;white-space:nowrap\">${n} wallet${n===1?'':'s'} · <span style=\"color:#eef1f3\">${(p.share*100).toFixed(1)}%<\u002Fspan><\u002Fspan><\u002Fdiv>`;}).join('');\n  return `<div data-rug-reasons=\"1\" style=\"display:flex;flex-direction:column;gap:12px;padding:18px 20px 20px;border-top:1px solid #141b20\">`\n    +`<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-family:${MONO_F};font-size:11px;color:#5f6b72\"><span>why probably rug<\u002Fspan><span>suspicious supply · ${(rug.share*100).toFixed(1)}% of float<\u002Fspan><\u002Fdiv>`\n    +rows\n    +`<p style=\"margin:2px 0 0;font-size:14px;line-height:1.5;color:#8a959c;text-wrap:pretty\">If these wallets sell into the current liquidity, the price could fall about ${dropPct(rug)}%.<\u002Fp><\u002Fdiv>`;\n}\nfunction chartHtml(st,rug,hdrPrice,W){\n  const mob=W<640, H=mob?230:300, sw=W-24;\n  const head=tf=>`<div style=\"display:flex;justify-content:space-between;gap:12px;padding:14px 20px 0;font-family:${MONO_F};font-size:11px;color:#5f6b72\"><span>price${tf?' · '+escH(tf):''}<\u002Fspan><span>GeckoTerminal<\u002Fspan><\u002Fdiv>`;\n  if(!st||st.status==='loading') return head('')+`<div style=\"padding:14px 20px 20px\"><div class=\"cs-skel\" data-chart-loading=\"1\" style=\"height:${H-40}px;border-radius:8px\"><\u002Fdiv><\u002Fdiv>`;\n  const d=st.data||{}, cs=(d.candles||[]).filter(c=>c&&c.length>=5&&c[4]>0);\n  const now=d.price_usd>0?d.price_usd:cs.length?cs[cs.length-1][4]:(hdrPrice>0?hdrPrice:null);\n  if(!now){   // нет данных GeckoTerminal: текстовая карточка, rug строкой\n    return head('')+`<div data-chart-empty=\"1\" style=\"display:flex;flex-direction:column;gap:10px;padding:26px 20px 24px;font-family:${MONO_F}\">`\n      +`<span style=\"font-size:13px;color:#8a959c\">no price data from GeckoTerminal for this token yet<\u002Fspan>`\n      +(rug?`<span style=\"font-size:15px;color:#ff4d4d\">probably rug −${dropPct(rug)}% if suspicious holders sell<\u002Fspan>`:'')+`<\u002Fdiv>`+rugReasons(rug);\n  }\n  const few=cs.length<5;\n  const pl=6, pr=mob?70:82, pt=22, pb=26, pw=sw-pl-pr, ph=H-pt-pb;\n  const xEnd=pl+pw*(rug?0.74:0.97), xArrow=pl+pw*0.96;\n  const level=rug?now*rug.level_factor:null;\n  const vals=(few?[]:cs.map(c=>c[4])).concat([now]);\n  let lo=Math.min(...vals), hi=Math.max(...vals);\n  if(level!=null) lo=Math.min(lo,level);\n  if(hi<=lo){hi=now*1.25; lo=Math.min(lo,now*0.75);}\n  const pad=(hi-lo)*0.08; hi+=pad; lo=Math.max(0,lo-pad);\n  const gap=rug?24:0;   // под уровнем rug — место для подписи\n  const y=v=>pt+(1-(v-lo)/(hi-lo))*(ph-gap);\n  const t0=few?0:cs[0][0], t1=few?1:cs[cs.length-1][0];\n  const x=t=>pl+(t1>t0?(t-t0)/(t1-t0):1)*(xEnd-pl);\n  const yn=y(now), yl=level!=null?y(level):null;\n  let g='';\n  const nt=mob?3:4;\n  for(let i=0;i<=nt;i++){   // сетка и ось цены\n    const v=lo+(hi-lo)*i/nt, yy=y(v);\n    g+=`<line x1=\"${pl}\" x2=\"${pl+pw}\" y1=\"${yy.toFixed(1)}\" y2=\"${yy.toFixed(1)}\" stroke=\"#11171b\" stroke-width=\"1\"/>`;\n    if(Math.abs(yy-yn)>16&&(yl==null||Math.abs(yy-yl)>16)) g+=`<text x=\"${pl+pw+8}\" y=\"${(yy+3.5).toFixed(1)}\" fill=\"#5f6b72\" font-size=\"10.5\">${fmtP(v)}<\u002Ftext>`;\n  }\n  if(!few){   // ось времени\n    const span=t1-t0, nx=mob?3:5;\n    const lab=t=>{const dt=new Date(t*1000), hm=dt.toTimeStr     const held=new Set();\n    this.crawlers.forEach(c=>{this.updateCrawler(c,now,dt); c.legs.forEach(l=>{if(l.anchor&&l.t>=1) held.add(l.anchor.el);});});\n    ctx.setLineDash([]); ctx.lineWidth=1.2; ctx.strokeStyle='rgba(159,217,255,0.42)';\n    held.forEach(el=>{if(!el.isConnected) return; const r=this.rect(el); if(!r.width) return; ctx.strokeRect(r.left-3.5,r.top-2.5,r.width+7,r.height+5);});\n    this.flashes=this.flashes.filter(f=>now-f.t<750&&f.el.isConnected);\n    this.flashes.forEach(f=>{const p=(now-f.t)/750, r=this.rect(f.el), pad=3+p*3; ctx.strokeStyle=rgba(LG,0.95*(1-p)); ctx.lineWidth=1.8; ctx.strokeRect(r.left-pad-.5,r.top-pad+.5,r.width+pad*2,r.height+pad*2-1);});\n    this.crawlers.forEach(c=>this.drawCrawler(ctx,c));\n  }\n\n  scrollToId(id){\n    const go=()=>{const el=document.getElementById(id); if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-70,behavior:'smooth'});};\n    if(this.state.view!=='landing'){this.toLanding(); setTimeout(go,80);} else go();\n  }\n\n  criteriaVals(){\n    const m=this.m, res=m.result, hd=(res&&res.header)||{}, done=m.done, ws=m.wallets.filter(w=>w.flags), n=ws.length;\n    const sum=a=>a.reduce((s,w)=>s+(w.share||0),0), has=f=>ws.filter(w=>w.flags.includes(f));\n    const par={}; const find=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x];}return x;};\n    m.wallets.forEach(w=>par[w.addr]=w.addr);\n    const uni=(a,b)=>{if(par[a]==null||par[b]==null)return; par[find(a)]=find(b);};\n    this.links.forEach(L=>uni(L.a,L.b)); this.clusters.forEach(C=>C.wallets.forEach(w=>uni(w,C.wallets[0])));\n    const groups={}; m.wallets.forEach(w=>{const r=find(w.addr);(groups[r]=groups[r]||[]).push(w);});\n    const gs=Object.values(groups), ops=gs.length, big=gs.reduce((b,g)=>sum(g)>sum(b)?g:b,[]);\n    const sorted=[...ws].sort((a,b)=>(b.share||0)-(a.share||0)), top10=sum(sorted.slice(0,10)), top1=sorted[0];\n    const proven=this.links.filter(l=>l.level==='proven').length, packL=this.links.filter(l=>l.level==='pack').length, pk=this.clusters.filter(c=>c.level==='pack');\n    const tr=has('transfer'), vg=has('virgin'), sn=has('sniper'), dep=has('deployer')[0];\n    const P=(res&&res.parts)||{};\n    const lvl=r=>r>=0.8?G:r>=0.4?A:RD, slots=chainOf(m.ca)==='solana', imp=fmtImpact(res&&res.impact);\n    const scored=(k,max)=>{const v=done&&P[k]!=null?P[k]:null; return v==null?{pts:`— / ${max}`,r:null}:{pts:`${v} / ${max}`,r:v/max};};\n    const pct=a=>sum(a).toFixed(1)+'%';\n    const rows=[\n      {name:'Operator clustering',desc:'Linked wallets collapse into one operator, scored by dump impact',find:n?`${n} wallets → ${ops} operators`+(big.length>1?` · biggest: ${big.length} wallets, ${pct(big)}`:'')+(done&&imp?` · dump ${imp}`:''):null,...scored('operator',35)},\n      {name:'Pack detection',desc:slots?'3+ fresh wallets buying within 2 slots with matching sizes':'3+ fresh wallets buying in one block with matching sizes',find:n?(pk.length?`${pk.length} pack · ${pk[0].wallets.length} wallets `+(slots?'within 2 slots':'in one block'):packL?`${packL} pack links, forming`:'no packs'):null,sig:pk.length?A:packL?A:G,pts:'→ operator'},\n      {name:'Proven links',desc:'Direct on-chain tie: tokens moved between two holders',find:n?(proven?`${proven} proven link`:'none'):null,sig:proven?RD:G,pts:'→ operator'},\n      {name:'Bundle detection',desc:'Wallets that received supply instead of buying it',find:n?(tr.length?`${tr.length} wallets got supply by transfer · ${pct(tr)}`:'none'):null,...scored('transfer',20)},\n      {name:'Virgin wallets',desc:'Never traded a token before this one',find:n?`${vg.length} of ${n} holders · ${pct(vg)} of float`:null,...scored('virgin',25)},\n      {name:'Sniper tracking',desc:'Entries in the first 30 seconds after launch',find:n?(sn.length?`${sn.length} sniper entries · ${pct(sn)}`:'none'):null,...scored('sniper',10)},\n      {name:'Concentration',desc:'Share of real circulating float held by the top',find:n?`top 10 hold ${top10.toFixed(1)}%`+(top1?` · #1 holds ${(top1.share||0).toFixed(1)}%`:''):null,...scored('concentration',10)},\n      {name:'Deployer',desc:'Creator wallet still among the top holders',find:n?(dep?`still holds ${(dep.share||0).toFixed(1)}%`:'not in top holders'):null,sig:dep?A:G,pts:'info'}\n    ];\n    let flagged=0;\n    const criteria=rows.map(c=>{\n      if(c.find==null) return {...c,find:'crawling…',findColor:'#4a555c',color:'#2c353b',glow:'transparent',status:'pending',w:'0%'};\n      let col; if(c.r!=null) col=lvl(c.r); else if(c.sig) col=c.sig; else col='#5f6b72';\n      if(col===RD||col===A) flagged++;\n      const st=c.r==null&&!c.sig?'checking':col===RD?'high':col===A?'watch':'pass';\n      return {...c,color:col,glow:rgba(col,0.6),findColor:col===G?'#aab4ba':'#dfe5e8',status:st,w:c.r!=null?(c.r*100)+'%':(c.sig&&c.sig!==G?'100%':'0%')};\n    });\n    const facts=[\n      ['price',hd.price],['holders',hd.holders!=null?Number(hd.holders).toLocaleString('en-US'):null],['total supply',hd.supply],['circulating',hd.circulating],\n      ['pool',hd.pool],['deployer',hd.deployer],['top 10 share',n?top10.toFixed(1)+'%':null],['wallets crawled',n?String(n):null]\n    ].map(([label,v])=>({label,value:v??'—',color:v==null?'#3a454c':'#dfe5e8'}));\n    return {criteria,facts,criteriaSummary:`${rows.length} criteria · ${flagged} flagged`};\n  }\n  renderVals(){\n    const m=this.m, now=performance.now(), scan=this.state.view==='scan';\n    const res=m.result, hd=(res&&res.header)||{}, done=m.done, err=m.error;\n    const n=Math.max(20,m.wallets.length), rows=[], chips=[], ex=EXPLORER[chainOf(m.ca)];\n    for(let i=0;i<n;i++){\n      const w=m.wallets[i], rank=String(i+1).padStart(2,'0');\n      if(!w){rows.push({rank,addr:ex?'····…····':'0x····…····',addrColor:'#262f35',bg:'transparent',shareText:'',shareW:'0%',shareColor:'#1c252b',badges:[],url:'',hasUrl:false,noUrl:true});}\n      else{\n        const fl=w.flags||[], wo=worstOf(fl), col=wo?wo.c:null, fresh=now-w.flashAt<700;\n        const un=fl.includes('unread'), url=ex?ex.account(FULL[w.addr]||w.addr):'';\n        rows.push({rank,addr:w.addr,addrColor:un?'#5f6b72':'#dfe5e8',bg:un?'transparent':col?rgba(col,fresh?0.2:(wo.w?0.06:0.025)):'rgba(159,217,255,0.03)',shareText:w.share!=null?w.share.toFixed(1)+'%':'…',shareW:w.share!=null?Math.min(100,w.share/6*100)+'%':'0%',shareColor:un?'#2c353b':col||'#3a454c',badges:fl.map(badge),url,hasUrl:!!url,noUrl:!url});\n      }\n      if(i<20){\n        const a=-Math.PI/2+i*Math.PI/10, wo=w&&worstOf(w.flags||[]);\n        chips.push({left:(50+Math.cos(a)*(innerWidth<640?31:38))+'%',top:(45+Math.sin(a)*34)+'%',label:w?w.addr:(ex?'····':'0x····'),color:w?(wo&&wo.w?wo.c:'#dfe5e8'):'#2c353b',border:w?rgba(wo?wo.c:LG,0.5):'#151c21'});\n      }\n    }\n    const el=((m.tEnd||now)-m.t0)/1000, mm=Math.floor(el/60), ss=(el%60).toFixed(1).padStart(4,'0');\n    const band=err?'ERROR':done?done.band:'CRAWLING', bandColor=BANDS[band]||'#8a959c';\n    const parts=PARTS.map(([k,max])=>{const v=done&&res&&res.parts?res.parts[k]:null, r=v!=null?v/max:0; return {label:k==='operator'?'operator (dump impact)':k,text:v!=null?`${v} / ${max}`:`— / ${max}`,w:(r*100)+'%',color:r>=0.8?G:r>=0.4?A:RD};});\n    const found=m.wallets.length;\n    return {\n      canvasRef:this.canvasRef, logRef:this.logRef, chartRef:this.chartRef,\n      chartDisplay:m.done&&m.result&&!m.error&&m.chart?'block':'none',\n      copyCaHero:()=>this.copyCa('hero'), copyCaSection:()=>this.copyCa('section'),\n      caHeroDone:this.state.caCopied==='hero', caHeroIdle:this.state.caCopied!=='hero',\n      caSectionDone:this.state.caCopied==='section', caSectionIdle:this.state.caCopied!=='section',\n      isLanding:!scan, isScan:scan,\n      input:this.state.input, inputError:this.state.inputError,\n      onInput:e=>{const v=e.target.value, c=chainOf(v.trim()); this.setState(c?{input:v,inputError:'',inputNotice:'',net:c}:{input:v,inputError:'',inputNotice:''});},\n      ...this.netVals(),\n      ...this.drawVals(),\n      ...this.rwVals(),\n      ...this.recentVals(),\n      ...this.secVals(),\n      onKey:e=>{if(e.key==='Enter') this.startScan(this.state.input);},\n      crawl:()=>this.startScan(this.state.input),\n      crawlSample:e=>{e.preventDefault(); this.startScan(SAMPLES[this.state.net]);},\n      goHome:e=>{e.preventDefault(); this.toLanding();},\n      navHow:e=>{e.preventDefault(); this.closeMenu(); this.scrollToId('how');},\n      navRoadmap:e=>{e.preventDefault(); this.closeMenu(); this.scrollToId('roadmap');},\n      navToken:e=>{e.preventDefault(); this.closeMenu(); this.scrollToId('token');},\n      demoRows:DEMO_ROWS, demoLog:this.demoLog,\n      statusLabel:err?'failed':done?'crawled':'crawling', statusColor:err?RD:done?bandColor:G,\n      ca:m.ca, caShort:shortCa(m.ca), stage:m.stage, elapsed:`${String(mm).padStart(2,'0')}:${ss}`,\n      sceneMax:m.sceneOpen?'1400px':'0px', sceneOpacity:m.sceneOpen?1:0, resultOpacity:m.sceneOpen?0.35:1,\n      nodeLabel:hd.ticker?'$'+hd.ticker:shortCa(m.ca), nodeSub:`${found} holders`,\n      chips, miniLog:m.log.slice(-5), log:m.log, eventCount:`${m.events} events`,\n      hName:hd.name||'—', hTicker:hd.ticker||'—', hMcap:fmtUsd(hd.mcap), hLiq:fmtUsd(hd.liquidity), hVol:fmtUsd(hd.vol24h), hAge:hd.age||'—',\n      rows, parts, ...this.criteriaVals(),\n      band, bandColor, bandBorder:rgba(bandColor,0.45), bandBg:rgba(bandColor,0.08),\n      score:done&&done.score!=null?String(m.scoreShown):'—', scoreColor:done?bandColor:'#262f35',\n      headline:err?err:done?done.headline:'crawlers are tracing the top holders',\n      reason:done?(done.detail||''):err?'scan stopped':m.stage, reasonColor:done?bandColor:'#5f6b72',\n      copyLabel:this.state.copied?'copied':'copy link',\n      copyLink:()=>{try{navigator.clipboard.writeText(location.href);}catch(e){} this.setState({copied:true}); setTimeout(()=>this.setState({copied:false}),1500);},\n      newCrawl:()=>this.toLanding()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u
